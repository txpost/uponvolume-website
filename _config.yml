name:                Trevor
title:               up on volume
author:              Trevor
twitter:             uponvolume
domain:              uponvolume.com
url:                 https://uponvolume.com
include:             ['_pages']
metadescription:     "notes to self about how to learn how to make money in stocks, building a solo-founder business, and other things I find interesting"

# baseurl is empty when the site is served at the apex domain (uponvolume.com).
baseurl:             ''

# Set to `true` to open non-internal links in new tabs, or
# set to `false` to open non-internal links in current tab.
open_external_links_in_new_tab: true

permalink:           /:slug
relative_permalinks: false

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

sass:
  sass_dir:          _sass
  style:             :compressed

collections:
  notes:
    output: true
    permalink: /:slug/

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: "notes"
    values:
      layout: "note"

tag_page_layout: tag
tag_page_dir: topics

# Ignore files Jekyll shouldn't ship to _site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - node_modules
