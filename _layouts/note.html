---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>

  <div class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}"
      >{{ page.date | date: "%B %-d, %Y" }}</time
    >
    {% if page.topics and page.topics.size > 0 %} · {% for topic in page.topics
    %}<a href="/topics/{{ topic | slugify }}/" class="tag">{{ topic }}</a>{%
    unless forloop.last %}, {% endunless %}{% endfor %} {% endif %}
  </div>

  <div class="post-content">{{ content }}</div>
</article>
